plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.13'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.gamq'
version = '0.0.1-SNAPSHOT'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url "https://jaspersoft.jfrog.io/jaspersoft/third-party-ce-artifacts/" }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// Swagger / OpenAPI
	implementation 'org.springdoc:springdoc-openapi-ui:1.7.0'
	// Hibernate 6 (Boot 3) spatial. The 5.6.15 artifact pulled a second,
	// javax-based hibernate-core into the runtime classpath.
	implementation 'org.hibernate.orm:hibernate-spatial'
	implementation group: 'commons-io', name: 'commons-io', version: '2.16.1'
	//jasperreport
	implementation 'net.sf.jasperreports:jasperreports:6.20.1'
	implementation 'net.sf.jasperreports:jasperreports-fonts:6.20.1'
	implementation 'net.sf.jasperreports:jasperreports-metadata:6.20.1'
	implementation 'net.sf.jasperreports:jasperreports-functions:6.20.1'
	implementation 'net.sf.jasperreports:jasperreports-custom-visualization:6.20.1'
	implementation 'net.sf.jasperreports:jasperreports-chart-themes:6.20.1'
	implementation 'net.sf.jasperreports:jasperreports-chart-customizers:6.20.1'
	implementation 'net.sf.jasperreports:jasperreports-annotation-processors:6.20.1'

	compileOnly 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Executable artifact consumed by Dockerfile and local deployments.
tasks.named('bootJar') { archiveFileName = 'app.jar' }
tasks.named('jar') { enabled = false }

tasks.withType(Test).configureEach { useJUnitPlatform() }
