server.port=${SERVER_PORT:8085}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.connection-timeout=60s
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_deportes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.platform=postgres

# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect
# JACKSON CONFIGURATION
spring.jackson.time-zone=America/La_Paz
# CORS CONFIGURATION
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://deportes.quillacollo.gob.bo,http://localhost:4200}

deportes.security.jwt-secret=${DEPORTES_JWT_SECRET:change-this-local-development-secret-32-bytes}
deportes.security.token-expiration-seconds=${DEPORTES_TOKEN_EXPIRATION_SECONDS:28800}

usuarios.base-url=${USUARIOS_BASE_URL:http://181.177.143.185:8080/api}
deportes.application.code=${APPLICATION_CODE:SIS-013}
deportes.application.name=${APPLICATION_NAME:DEPORTESAPP}
deportes.application.admin-menu=${DEPORTES_ADMIN_MENU:Administracion}
ruat.gateway.base-url=${RUAT_GATEWAY_BASE_URL:http://localhost:8090/api/ruat}
ruat.gateway.internal-api-key=${RUAT_GATEWAY_INTERNAL_API_KEY:GAMQ2026}
# Shared outgoing HTTP limits for RUAT, usuarios and manual/automatic operations.
external.client.connect-timeout=${EXTERNAL_CLIENT_CONNECT_TIMEOUT:10s}
external.client.read-timeout=${EXTERNAL_CLIENT_READ_TIMEOUT:180s}
logging.level.ruat.http=${RUAT_HTTP_LOG_LEVEL:INFO}
logging.level.usuarios.http=${USUARIOS_HTTP_LOG_LEVEL:INFO}
logging.level.external.http=${EXTERNAL_HTTP_LOG_LEVEL:INFO}

# FILE UPLOAD CONFIGURATION
upload.requisitoFilePath=${UPLOAD_REQUISITO_PATH:D:/deportes/requisitos/}
upload.inspeccionFilePath=${UPLOAD_INSPECCION_PATH:D:/deportes/inspecciones/}
upload.publicidadFilePath=${UPLOAD_PUBLICIDAD_PATH:D:/deportes/letreros/}
