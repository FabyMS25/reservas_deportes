
spring.jpa.datasource=POSTGRESQL
spring.datasource.platform=postgres
#spring.datasource.url=jdbc:postgresql://localhost:5432/db_deportes2026
spring.datasource.url=jdbc:postgresql://localhost:5433/db_deportes
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.sql=true
##Aditional properties JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.time-zone= America/La_Paz

# Server
server.port=8085
server.address=127.0.0.1
server.forward-headers-strategy=framework
server.connection-timeout=60s


# RUAT API client
#ruat.base-url=https://consolidacionjboss.ruat.gob.bo
ruat.base-url=https://aplicaciones.ruat.gob.bo
ruat.client.connect-timeout=10s
ruat.client.read-timeout=60s

# Upload and Download paths
upload.requisitoFilePath=D:/licencias/requisitos/
upload.inspeccionFilePath=D:/licencias/inspecciones/
upload.publicidadFilePath=D:/licencias/letreros/

