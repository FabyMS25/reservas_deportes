server.forward-headers-strategy=framework
server.port=${SERVER_PORT:8085}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.tomcat.connection-timeout=60s

# DATABASE
spring.sql.init.platform=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_deportes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# JPA / HIBERNATE /jackson
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jackson.time-zone=America/La_Paz

# CORS
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${app.public-base-url}}

# EXTERNAL SERVICES
usuarios.gateway.base-url=${USUARIOS_GATEWAY_BASE_URL:http://181.177.143.185:8080/api}
usuarios.session-cleanup-interval-ms=${USUARIOS_SESSION_CLEANUP_INTERVAL_MS:30000}
ruat-be.gateway.base-url=${RUAT_BE_GATEWAY_BASE_URL:http://localhost:8090/api/ruat}
ruat-be.gateway.api-key=${RUAT_BE_GATEWAY_API_KEY}
app.code=${APP_CODE:SIS-013}
app.name=${APP_NAME:DEPORTESAPP}
app.admin-menu=${APLICATION_ADMIN_MENU:Administracion}

# EMAIL settings.
#emailjs.api-url=${EMAILJS_API_URL:https://api.emailjs.com/api/v1.0/email/send}
#emailjs.service-id=${EMAILJS_SERVICE_ID:}
#emailjs.password-reset-template-id=${EMAILJS_PASSWORD_RESET_TEMPLATE_ID:}
#emailjs.public-key=${EMAILJS_PUBLIC_KEY:}

external.client.connect-timeout=${EXTERNAL_CLIENT_CONNECT_TIMEOUT:10s}
external.client.read-timeout=${EXTERNAL_CLIENT_READ_TIMEOUT:180s}
logging.level.external.http=${EXTERNAL_HTTP_LOG_LEVEL:INFO}

# SECURITY
deportes.security.token-expiration-seconds=${DEPORTES_TOKEN_EXPIRATION_SECONDS:28800}
deportes.security.jwt-secret=${DEPORTES_JWT_SECRET:change-this-local-development-secret-32-bytes}
