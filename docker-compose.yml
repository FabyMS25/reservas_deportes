name: deportes

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  be-deportes:
    image: deportes-be
    container_name: deportes-be
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    env_file:
      - .env
    ports:
      - "127.0.0.1:8085:8085"
    restart: unless-stopped
    logging: *logging

  fe-deportes:
    image: deportes-fe
    container_name: deportes-fe
    build:
      context: ../deportes-fe
      dockerfile: Dockerfile
    pull_policy: build
    ports:
      - "127.0.0.1:4205:80"
    depends_on:
      - be-deportes
    restart: unless-stopped
    logging: *logging

