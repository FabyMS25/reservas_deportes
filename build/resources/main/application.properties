spring.jpa.datasource=POSTGRESQL
spring.datasource.platform=postgres

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_deprotes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ADMIN}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.sql=true

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect

spring.jackson.time-zone=America/La_Paz

server.port=${SERVER_PORT:8085}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
server.connection-timeout=60s

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:https://deportes.quillacollo.gob.bo,http://localhost:4200}

usuarios.base-url=${USUARIOS_BASE_URL:http://181.177.143.185:8080/api}
deportes.application.code=${DEPORTES_APPLICATION_CODE:SIS-013}
deportes.application.name=${DEPORTES_APPLICATION_NAME:DEPORTESAPP}
deportes.application.admin-menu=${DEPORTES_ADMIN_MENU:Administracion}
deportes.security.jwt-secret=${DEPORTES_JWT_SECRET:change-this-local-development-secret-32-bytes}
deportes.security.token-expiration-seconds=${DEPORTES_TOKEN_EXPIRATION_SECONDS:28800}

#ruat.base-url=${RUAT_BASE_URL:https://consolidacionjboss.ruat.gob.bo}
ruat.base-url=${RUAT_BASE_URL:https://aplicaciones.ruat.gob.bo}
ruat.client.connect-timeout=10s
ruat.client.read-timeout=60s

upload.requisitoFilePath=${UPLOAD_REQUISITO_PATH:D:/deportes/requisitos/}
upload.inspeccionFilePath=${UPLOAD_INSPECCION_PATH:D:/deportes/inspecciones/}
upload.publicidadFilePath=${UPLOAD_PUBLICIDAD_PATH:D:/deportes/letreros/}



